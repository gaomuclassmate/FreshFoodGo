plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.quick.freshfoodgo'
    compileSdk 36

    defaultConfig {
        applicationId "com.quick.freshfoodgo"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'io.github.youth5201314:banner:2.2.3'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'

    // gson 解析
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    // okhttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // okhttp日志拦截器（看请求日志，调试必备）
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'


    //superbase
    implementation platform('io.github.jan-tennert.supabase:bom:3.5.0')
    implementation "io.github.jan-tennert.supabase:auth-kt"
    implementation "io.github.jan-tennert.supabase:supabase-kt"
    implementation "io.github.jan-tennert.supabase:postgrest-kt"
    // ktor android client
    implementation "io.ktor:ktor-client-android:3.1.3"

    implementation("androidx.browser:browser:1.8.0")





    // Views/Fragments integration
//    implementation("androidx.navigation:navigation-fragment:2.10.2")
//    implementation("androidx.navigation:navigation-ui:2.10.2")
//    // Feature module support for Fragments
//    implementation("androidx.navigation:navigation-dynamic-features-fragment:2.10.2")
//
//    // JSON serialization library, works with the Kotlin serialization plugin
//    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")


}